<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan Matematika SD</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math SD">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{--bg:#f4f7ff;--card:#fff;--tx:#1d2540;--mu:#5d6785;--pr:#4f46e5;--prt:#fff;--bd:#d9def0;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--card:#1c2040;--tx:#eef0ff;--mu:#a2abd0;--pr:#818cf8;--prt:#12142a;--bd:#323862;--ok:#4ade80;--okb:#14532d;--no:#f87171;--nob:#7f1d1d}}
:root[data-theme="dark"]{--bg:#12142a;--card:#1c2040;--tx:#eef0ff;--mu:#a2abd0;--pr:#818cf8;--prt:#12142a;--bd:#323862;--ok:#4ade80;--okb:#14532d;--no:#f87171;--nob:#7f1d1d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Nunito","Segoe UI",system-ui,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:26px;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer}
.lv{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.lv:active,.lv:hover{border-color:var(--pr)}
.lv .e{font-size:34px}.lv b{font-size:19px;display:block}.lv span{color:var(--mu);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-weight:700;margin-bottom:8px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.q{font-size:21px;font-weight:700;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;font-size:19px;font-weight:700}
.opt .l{flex:none;width:32px;height:32px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:15px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.opt:disabled{cursor:default}
.btn{display:block;width:100%;background:var(--pr);color:var(--prt);border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:800;margin-top:8px}
.btn.alt{background:transparent;color:var(--pr);border:2px solid var(--pr)}
.fb{font-weight:800;margin:6px 0 0;min-height:24px}
.score{text-align:center}.score .big{font-size:56px;font-weight:900;color:var(--pr);margin:0}
.stars{font-size:32px;letter-spacing:4px}
.rv{border-top:1px solid var(--bd);padding:10px 0;font-size:15px}.rv small{color:var(--mu);display:block}
.hide{display:none}
input{width:100%;font:inherit;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);margin-bottom:10px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const N=['Ani','Budi','Citra','Dedi','Eka','Fajar','Gita','Hadi'],n=()=>pick(N);
const fm=v=>String(v).replace('.',','),rp=v=>'Rp '+v.toLocaleString('id-ID');
function mc(q,c,w,o={}){const f=o.f||fm,s=o.step||1,x=v=>+v.toFixed(2);c=x(c);let set=[c];
 shuffle(w.map(x)).forEach(v=>{if(set.length<4&&v>=0&&!set.includes(v))set.push(v)});
 let t=0;while(set.length<4&&t++<80){const d=x(c+R(-8,8)*s);if(d>=0&&!set.includes(d))set.push(d)}
 return{q,c,o:shuffle(set),f}}
const LV={
1:{name:'Level 1',sub:'Kelas 1–2 · bilangan, waktu, uang · 30 detik/soal',e:'🌱',g:[
 ()=>{const a=R(20,60),b=R(15,39),c=a+b;return mc(`${n()} punya ${a} kelereng. Ia diberi ${b} kelereng lagi. Berapa kelereng ${'sekarang'}?`,c,[c+10,c-10,c+1,c-1,a-b])},
 ()=>{const a=R(50,99),b=R(11,a-10),c=a-b;return mc(`${n()} punya ${a} stiker. ${b} stiker diberikan kepada adik. Berapa sisa stikernya?`,c,[c+10,c-10,c+1,c-1,a+b])},
 ()=>{const a=R(10,50),b=R(11,40);return mc(`${a} + ? = ${a+b}`,b,[b+10,b-10,b+1,b-1,a])},
 ()=>{const x=pick([2,3,4,5,10]),y=R(2,10),c=x*y;return mc(`Ada ${y} kotak. Setiap kotak berisi ${x} pensil. Berapa pensil seluruhnya?`,c,[c+x,c-x,c+y,x+y])},
 ()=>{const a=R(1,9),b=R(1,9),c=R(1,9),v=b*10;return mc(`Berapa nilai angka ${b} pada bilangan ${a}${b}${c}?`,v,[b,b*100,a*100,c*10])},
 ()=>{const y=pick([2,3,4,5]),x=R(2,9),t=x*y;return mc(`${n()} membagi ${t} permen sama banyak kepada ${y} teman. Berapa permen untuk tiap teman?`,x,[x+1,x-1,t-y,y])},
 ()=>{const s=shuffle([R(100,399),R(400,699),R(700,999)]),c=Math.max(...s);return mc(`Bilangan manakah yang paling besar: ${s.join(', ')}?`,c,s.filter(v=>v!==c).concat([c-100]),{f:v=>v})},
 ()=>{const a=R(11,89);return mc(`${a} + ? = 100`,100-a,[a,100-a+10,100-a-10,100-a+1])},
 ()=>{const h=R(1,10);return mc(`Sekarang pukul ${h}.00. Pukul berapa 2 jam lagi?`,h+2,[h+1,h+3,h+4,h],{f:v=>v+'.00'})},
 ()=>{const a=pick([1000,2000,5000]),k=R(2,5),b=pick([500,1000]),c=a*k+b;return mc(`${n()} punya ${k} uang ${rp(a)} dan 1 uang ${rp(b)}. Berapa jumlah uangnya?`,c,[a*k,c+500,c-500,a+b],{f:rp,step:500})}]},
2:{name:'Level 2',sub:'Kelas 3–4 · kali, bagi, pecahan, waktu, uang · 45 detik/soal',e:'🚀',g:[
 ()=>{const a=R(12,48),b=R(3,9),c=a*b;return mc(`Satu kantong berisi ${a} jeruk. Berapa jeruk dalam ${b} kantong?`,c,[c+a,c-a,c+10,c-10,a+b])},
 ()=>{const d=R(3,9),q=R(12,60),t=d*q;return mc(`${t} buku disusun sama banyak pada ${d} rak. Berapa buku tiap rak?`,q,[q+1,q-1,q+10,q-10,t-d])},
 ()=>{const d=pick([2,3,4,5,6,8]),u=R(1,d-1),w=d*R(3,12),c=w/d*u;return mc(`Berapa ${u}/${d} dari ${w}?`,c,[w/d,c+w/d,w-c,c+u])},
 ()=>{const b=R(30,80),s=R(10,b-5),S=b+s,D=b-s,a=n();return mc(`${a} dan ${n()} memiliki ${S} kelereng. ${a} punya ${D} kelereng lebih banyak. Berapa kelereng ${a}?`,b,[s,S/2,b+D,b-5,b+5])},
 ()=>{const l=R(5,15),w=R(3,l-1),c=l*w;return mc(`Persegi panjang berukuran ${l} cm × ${w} cm. Berapa luasnya (cm²)?`,c,[2*(l+w),l+w,c+l,c-w])},
 ()=>{const p=500*R(2,6),k=R(3,8),c=50000-p*k;return mc(`${n()} membeli ${k} pensil dengan harga ${rp(p)} per buah. Ia membayar ${rp(50000)}. Berapa kembaliannya?`,c,[p*k,c+1000,c-1000,50000-p],{f:rp,step:1000})},
 ()=>{const s=R(2,9),d=R(3,9);return mc(`Pola bilangan: ${[0,1,2,3].map(i=>s+i*d).join(', ')}, … Berapa bilangan ke-8?`,s+7*d,[s+8*d,s+6*d,s+7*d+1,s+7*d-1])},
 ()=>{const a=R(250,480),b=R(260,490),c=a+b;return mc(`Sekolah memiliki ${a} siswa laki-laki dan ${b} siswa perempuan. Berapa jumlah seluruh siswa?`,c,[c+10,c-10,c+100,c-100,b-a])},
 ()=>{const h=R(1,5),m=pick([15,30,45]),c=h*60+m;return mc(`Pelajaran berlangsung ${h} jam ${m} menit. Berapa menit lamanya?`,c,[h*100+m,c+15,c-15,h*60,c+60],{f:v=>v+' menit',step:15})},
 ()=>{const p=R(3,9)*1000,k=R(2,5),b=R(2,6)*1000,c=p*k+b;return mc(`Satu buku harganya ${rp(p)}. ${n()} membeli ${k} buku dan 1 penggaris seharga ${rp(b)}. Berapa total bayarnya?`,c,[p*k,c+1000,c-1000,p+b],{f:rp,step:1000})},
 ()=>{const d=pick([5,6,8,10]),a=R(1,3),b=R(1,4),c=a+b;return mc(`${a}/${d} + ${b}/${d} = ?/${d}`,c,[c+1,c-1,a*b,Math.abs(b-a)],{f:v=>v+'/'+d})},
 ()=>{const d=pick([2,3,4,5]),w=R(1,4),r=R(1,d-1),c=w*d+r;return mc(`${w} ${r}/${d} = ?/${d} (ubah ke pecahan biasa)`,c,[c+d,c-1,w+r,w*d,c+1],{f:v=>v+'/'+d})}]},
3:{name:'Level 3',sub:'Kelas 5–6 · rasio, persen, diskon, waktu · 60 detik/soal',e:'🏆',g:[
 ()=>{const x=R(2,5),y=x+R(1,4),k=R(3,9),a=n();return mc(`Perbandingan uang ${a} dan ${n()} adalah ${x} : ${y}. Jika uang ${a} Rp ${x*k}.000, berapa ribu rupiah uang temannya?`,y*k,[x*k+y,y*k+x,(y-x)*k,y*k+k],{f:v=>'Rp '+v+'.000'})},
 ()=>{const p=pick([10,20,25,30,50]),w=20*R(5,25),c=w*p/100;return mc(`Berapa ${p}% dari ${w}?`,c,[w/p,c+10,c-10,w-c,p*2])},
 ()=>{const k=R(5,20),w=12*k;return mc(`${n()} memiliki Rp ${w}.000. Ia membelanjakan 1/3 uangnya, lalu 1/4 dari sisanya. Berapa ribu rupiah sisa uangnya?`,6*k,[4*k,3*k,5*k,7*k,w/3],{f:v=>'Rp '+v+'.000'})},
 ()=>{const m=R(50,70),a=m+R(-10,10),b=m+R(-10,10),c=m+R(-10,10),d=4*m-a-b-c;return mc(`Rata-rata 4 nilai ulangan adalah ${m}. Tiga nilainya ${a}, ${b}, dan ${c}. Berapa nilai keempat?`,d,[d+4,d-4,m,d+10,d-10])},
 ()=>{const b=2*R(3,10),h=R(4,15),c=b*h/2;return mc(`Segitiga memiliki alas ${b} cm dan tinggi ${h} cm. Berapa luasnya (cm²)?`,c,[b*h,b+h,c+b,c-h])},
 ()=>{const v=10*R(4,9),t=R(2,6),d=v*t;return R(0,1)?mc(`Mobil melaju ${v} km/jam selama ${t} jam. Berapa km jarak yang ditempuh?`,d,[d+v,d-v,v+t,d+10]):mc(`Sebuah bus menempuh ${d} km dalam ${t} jam dengan kecepatan tetap. Berapa km/jam kecepatannya?`,v,[v+10,v-10,d-t,v+5])},
 ()=>{const p=R(11,99)/10,k=R(2,9),c=p*k;return mc(`Harga 1 kg apel Rp ${fm(p)}0 ribu. Berapa ribu rupiah untuk ${k} kg?`,c,[c+1,c-1,c+k,c-k,p+k],{step:.1,f:v=>'Rp '+fm(v)+'0 ribu'})},
 ()=>{const x=R(2,5),y=x+R(1,4),k=R(4,12),T=(x+y)*k;return mc(`Perbandingan kelereng Ani dan Budi ${x} : ${y}. Jika jumlahnya ${T}, berapa selisih kelereng mereka?`,(y-x)*k,[y*k,x*k,(y-x)*k+k,T-y])},
 ()=>{const l=R(4,12),w=R(3,9),h=R(2,8);return mc(`Balok berukuran panjang ${l} cm, lebar ${w} cm, tinggi ${h} cm. Berapa volumenya (cm³)?`,l*w*h,[l+w+h,l*w,2*(l*w+l*h+w*h),l*w*h+l])},
 ()=>{const h=R(6,9),m=pick([10,20,40,50]),d=R(80,200),s=h*60+m,e=s+d,t=x=>String(Math.floor(x/60)).padStart(2,'0')+'.'+String(x%60).padStart(2,'0');return mc(`Kereta berangkat pukul ${t(s)} dan tiba pukul ${t(e)}. Berapa menit lama perjalanannya?`,d,[d+10,d-10,d+60,d-20,Math.floor(d/60)],{f:v=>v+' menit',step:10})},
 ()=>{const p=1000*R(20,80),d=pick([10,20,25,50]),c=p-p*d/100;return mc(`Sepatu seharga ${rp(p)} diskon ${d}%. Berapa harga yang dibayar?`,c,[p*d/100,p+p*d/100,c+1000,c-1000],{f:rp,step:1000})},
 ()=>{const d=pick([2,3,4]),a=R(1,4),b=R(1,4),r1=R(1,d-1),r2=R(1,d-1),c=(a+b)*d+r1+r2;return mc(`${a} ${r1}/${d} + ${b} ${r2}/${d} = ?/${d}`,c,[c+d,c-1,c+1,a+b+r1+r2],{f:v=>v+'/'+d})}]}};
const app=document.getElementById('app');let S={};
function home(){clearInterval(S.iv);app.innerHTML=`<h1>🧮 Latihan Matematika</h1><p class="sub">${U?'Halo, '+LS.g()[U].name+'! 👋 ':''}Soal gaya Singapura · 20 soal per sesi · ada timer ⏱</p>`+
 Object.keys(LV).map(k=>`<button class="lv" onclick="start(${k})"><span class="e">${LV[k].e}</span><span><b>${LV[k].name}</b><span>${LV[k].sub}</span></span></button>`).join('')+
 `<p class="sub">Setiap sesi soalnya diacak ulang 🎲</p>`+userBar()}
function start(l){const g=LV[l].g,seen=new Set(),qs=[];let t=0;
 const ix=g.map((_,k)=>k),order=shuffle(ix.concat(shuffle(ix).slice(0,Math.max(0,Q-ix.length))));
 let i=0;while(qs.length<Q&&t++<200){const k=order[i++%order.length],q=g[k]();if(!seen.has(q.q)){seen.add(q.q);q.t=TP[l][k];qs.push(q)}}
 S={l,qs,i:0,sc:0,wr:[],rs:[]};show()}
function show(){const q=S.qs[S.i];
 app.innerHTML=`<div class="top"><span>Soal ${S.i+1} / ${Q}</span><span id="tm">⏱</span><span>⭐ ${S.sc}</span></div><div class="bar"><i style="width:${S.i*100/Q}%"></i></div>
 <div class="card"><p class="q">${q.q}</p>${q.o.map((v,j)=>`<button class="opt" onclick="ans(${j})"><span class="l">${'ABCD'[j]}</span>${q.f(v)}</button>`).join('')}
 <p class="fb" id="fb"></p><button class="btn hide" id="nx" onclick="next()">${S.i<Q-1?'Lanjut ➜':'Lihat Skor 🎉'}</button></div>
 <button class="btn alt" onclick="home()">Keluar</button>`;tick()}
function ans(j){clearInterval(S.iv);const q=S.qs[S.i],bs=document.querySelectorAll('.opt'),ok=q.o[j]===q.c;
 bs.forEach((b,k)=>{b.disabled=true;if(q.o[k]===q.c)b.classList.add('ok')});
 if(ok){S.sc++}else{if(j>=0)bs[j].classList.add('no');S.wr.push({q:q.q,y:j>=0?q.f(q.o[j]):'(waktu habis)',c:q.f(q.c)})}
 const f=document.getElementById('fb');f.textContent=ok?'✅ Benar! Hebat!':(j<0?'⏰ Waktu habis! ':'❌ Belum tepat. ')+'Jawaban benar: '+q.f(q.c);f.style.color=ok?'var(--ok)':'var(--no)';
 S.rs.push({t:q.t,ok,s:TL[S.l]-S.t});document.getElementById('nx').classList.remove('hide')}
function next(){S.i++;S.i<Q?show():end()}
const TL={1:30,2:45,3:60},Q=20;
function tick(){clearInterval(S.iv);S.t=TL[S.l];upd();S.iv=setInterval(()=>{S.t--;upd();if(S.t<=0){clearInterval(S.iv);ans(-1)}},1000)}
function upd(){const e=document.getElementById('tm');if(e){e.textContent='⏱ '+S.t+' dtk';e.style.color=S.t<=10?'var(--no)':''}}
function end(){save();const s=S.sc,p=s/Q,m=p>=.9?'Luar biasa! Kamu jagoan matematika!':p>=.7?'Hebat! Sedikit lagi sempurna!':p>=.5?'Bagus! Terus berlatih ya!':'Ayo semangat, coba lagi!',st=p>=.9?3:p>=.6?2:1;
 app.innerHTML=`<div class="card score"><div class="stars">${'⭐'.repeat(st)}</div><p class="big">${s} / ${Q}</p><p><b>${s}</b> jawaban benar</p><p>${m}</p></div>
 <button class="btn" onclick="start(${S.l})">🎲 Main Lagi (soal baru)</button><button class="btn alt" onclick="home()">Ganti Level</button>`+(U?`<button class="btn alt" onclick="analisa()">📊 Lihat Analisa</button>`:`<p class="sub" style="margin-top:12px">Masuk agar hasil tersimpan &amp; dianalisa.</p>`)+
 (S.wr.length?`<div class="card" style="margin-top:14px"><b>Pembahasan jawaban yang salah</b>${S.wr.map(w=>`<div class="rv">${w.q}<small>Jawabanmu: ${w.y} · Benar: <b>${w.c}</b></small></div>`).join('')}</div>`:'')}
const TP={1:['Tambah & Kurang','Tambah & Kurang','Tambah & Kurang','Perkalian & Pembagian','Nilai Tempat & Pola','Perkalian & Pembagian','Nilai Tempat & Pola','Tambah & Kurang','Waktu','Uang'],2:['Perkalian & Pembagian','Perkalian & Pembagian','Pecahan','Soal Cerita (Model Batang)','Geometri','Uang','Nilai Tempat & Pola','Tambah & Kurang','Waktu','Uang','Pecahan','Pecahan'],3:['Rasio & Persen','Rasio & Persen','Pecahan','Rata-rata & Kecepatan','Geometri','Rata-rata & Kecepatan','Uang','Rasio & Persen','Geometri','Waktu','Rasio & Persen','Pecahan']};
const LS={g(){try{return JSON.parse(localStorage.getItem('lms')||'{}')}catch(e){return{}}},s(d){try{localStorage.setItem('lms',JSON.stringify(d))}catch(e){}}};
let U=null;
const userBar=()=>U?`<button class="btn" onclick="analisa()">📊 Analisa Kemampuan Saya</button><button class="btn alt" onclick="U=null;loginView()">Keluar Akun</button>`:`<button class="btn alt" onclick="loginView()">🔐 Masuk untuk menyimpan kemajuan</button>`;
function loginView(msg){clearInterval(S.iv);app.innerHTML=`<h1>🧮 Latihan Matematika</h1><p class="sub">Masuk agar kemajuan tersimpan dan dianalisa</p><div class="card"><input id="nm" placeholder="Nama" maxlength="20" autocomplete="off"><input id="pn" placeholder="PIN 4 angka" inputmode="numeric" maxlength="4" type="password"><p class="fb" style="color:var(--no)">${msg||''}</p><button class="btn" onclick="login()">Masuk / Daftar</button></div><button class="btn alt" onclick="U=null;home()">Main sebagai tamu</button><p class="sub" style="margin-top:14px">Nama baru otomatis terdaftar. Data tersimpan di perangkat ini.</p>`}
function login(){const nm=document.getElementById('nm').value.replace(/[<>&"]/g,'').trim(),pn=document.getElementById('pn').value;if(!nm||!/^\d{4}$/.test(pn))return loginView('Isi nama dan PIN 4 angka.');const d=LS.g(),k=nm.toLowerCase();if(d[k]&&d[k].pin!==pn)return loginView('PIN salah.');if(!d[k])d[k]={name:nm,pin:pn,st:{},ses:[]};LS.s(d);U=k;home()}
function save(){if(!U)return;const d=LS.g(),u=d[U];if(!u)return;S.rs.forEach(r=>{const a=u.st[r.t]=u.st[r.t]||{n:0,c:0,s:0};a.n++;a.c+=r.ok?1:0;a.s+=r.s});u.ses.push({d:Date.now(),l:S.l,sc:S.sc,n:Q});u.ses=u.ses.slice(-30);LS.s(d)}
function analisa(){const u=U&&LS.g()[U];if(!u)return loginView();
 const rs=Object.entries(u.st).map(([t,a])=>({t,n:a.n,p:Math.round(100*a.c/a.n),s:Math.round(a.s/a.n)})).sort((a,b)=>b.p-a.p),ok=rs.filter(r=>r.n>=3),kuat=ok.filter(r=>r.p>=80),lemah=ok.filter(r=>r.p<60).reverse(),ses=u.ses.slice(-5),
 col=p=>p>=80?'var(--ok)':p>=60?'#d97706':'var(--no)',lb=r=>r.n<3?'data belum cukup':r.p>=80?'💪 Kuat':r.p>=60?'👍 Cukup':'🎯 Perlu dilatih',
